services:
  app:
    image: communications-platform-php-app:${APP_IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: communications-platform-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - ./storage:/var/www/html/storage
      - freeswitch_logs:/var/log/freeswitch:ro
    networks:
      - app_net
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-http://localhost:8231}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-communications}
      - DB_USERNAME=${DB_USERNAME:-communications}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - FREESWITCH_HOST=freeswitch
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
    healthcheck:
      test: ["CMD", "php", "-r", "exit(0);"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:alpine
    container_name: communications-platform-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8231}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy
    networks:
      - app_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres:
    image: postgres:16-alpine
    container_name: communications-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-communications}
      POSTGRES_USER: ${DB_USERNAME:-communications}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    networks:
      - app_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-communications} -d ${DB_DATABASE:-communications}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: communications-platform-redis
    restart: unless-stopped
    command: >-
      sh -c 'if [ -n "$REDIS_PASSWORD" ] && [ "$REDIS_PASSWORD" != "null" ] && [ "$REDIS_PASSWORD" != "NULL" ]; then
        exec redis-server --requirepass "$REDIS_PASSWORD";
      else
        exec redis-server;
      fi'
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_net
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  queue:
    image: communications-platform-php-app:${APP_IMAGE_TAG:-local}
    container_name: communications-platform-queue
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=90 --sleep=3
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - certs_data:/etc/letsencrypt
    networks:
      - app_net
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-http://localhost:8231}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-communications}
      - DB_USERNAME=${DB_USERNAME:-communications}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}

  scheduler:
    image: communications-platform-php-app:${APP_IMAGE_TAG:-local}
    container_name: communications-platform-scheduler
    restart: unless-stopped
    command: php artisan schedule:work
    depends_on:
      app:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor
      - certs_data:/etc/letsencrypt
    networks:
      - app_net
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-http://localhost:8231}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-communications}
      - DB_USERNAME=${DB_USERNAME:-communications}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}

  certbot:
    image: certbot/certbot
    container_name: communications-platform-certbot
    volumes:
      - certs_data:/etc/letsencrypt
      - .:/var/www/html
    networks:
      - app_net
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  redis_data:
  vendor_data:
  certs_data:
  freeswitch_logs:

networks:
  app_net:
    name: communications-platform
    driver: bridge
