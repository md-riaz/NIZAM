    get:
      tags: [Queues]
      summary: Get queue
      operationId: getQueue
      responses:
        '200':
          description: Queue details
    put:
      tags: [Queues]
      summary: Update queue
      operationId: updateQueue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueInput'
      responses:
        '200':
          description: Queue updated
    delete:
      tags: [Queues]
      summary: Delete queue
      operationId: deleteQueue
      responses:
        '204':
          description: Queue deleted

  /organizations/{organizationId}/queues/{queueId}/members:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/QueueId'
    get:
      tags: [Queues]
      summary: List queue members
      operationId: listQueueMembers
      responses:
        '200':
          description: Queue members
    post:
      tags: [Queues]
      summary: Add queue member
      operationId: addQueueMember
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueMemberAddRequest'
      responses:
        '200':
          description: Queue member added

  /organizations/{organizationId}/queues/{queueId}/members/{agentId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/QueueId'
      - $ref: '#/components/parameters/AgentId'
    delete:
      tags: [Queues]
      summary: Remove queue member
      operationId: removeQueueMember
      responses:
        '204':
          description: Queue member removed

  /organizations/{organizationId}/queues/{queueId}/metrics/realtime:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/QueueId'
    get:
      tags: [Queue Metrics]
      summary: Get real-time queue metrics
      operationId: realtimeQueueMetrics
      responses:
        '200':
          description: Realtime queue metrics

  /organizations/{organizationId}/queues/{queueId}/metrics/aggregate:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/QueueId'
    post:
      tags: [Queue Metrics]
      summary: Aggregate queue metrics
      operationId: aggregateQueueMetrics
      responses:
        '200':
          description: Aggregated queue metrics

  /organizations/{organizationId}/queues/{queueId}/metrics/history:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/QueueId'
    get:
      tags: [Queue Metrics]
      summary: Queue metrics history
      operationId: historyQueueMetrics
      responses:
        '200':
          description: Queue metric history

  /organizations/{organizationId}/wallboard:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Queue Metrics]
      summary: Wallboard data for organization queues
      operationId: wallboard
      responses:
        '200':
          description: Wallboard metrics

  /organizations/{organizationId}/agent-states:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Queue Metrics]
      summary: Agent state overview
      operationId: agentStates
      responses:
        '200':
          description: Agent states

  /organizations/{organizationId}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Audit Logs]
      summary: List audit logs
      operationId: listAuditLogs
      responses:
        '200':
          description: Audit log list

  /organizations/{organizationId}/audit-logs/{auditLogId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/AuditLogId'
    get:
      tags: [Audit Logs]
      summary: Get audit log
      operationId: getAuditLog
      responses:
        '200':
          description: Audit log details

  /organizations/{organizationId}/supervisor-reports/call-summary:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Admin]
      summary: Get supervisor call summary report
      description: |
        Returns aggregated organization call totals for the requested inclusive date range.
        Query parameters: `date_from` and `date_to` in YYYY-MM-DD format.
      operationId: supervisorCallSummary
      responses:
        '200':
          description: Supervisor call summary report
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationId}/supervisor-reports/missed-returned-calls:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Admin]
      summary: Get supervisor missed and returned calls report
      description: |
        Returns inbound missed calls for the requested inclusive date range together with
        any matched returned call data.

        Query parameters:
        - `date_from` and `date_to` in YYYY-MM-DD format
        - optional `window_days` override for the returned-call lookup window
      operationId: supervisorMissedReturnedCalls
      responses:
        '200':
          description: Supervisor missed/returned calls report
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationId}/supervisor-reports/voicemails-needing-follow-up:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Admin]
      summary: Get supervisor voicemails needing follow-up report
      description: |
        Returns voicemail-received events for the requested inclusive date range, including
        follow-up state, recording review flags, and matched returned call data.

        Query parameters:
        - `date_from` and `date_to` in YYYY-MM-DD format
        - optional `window_days` override for the returned-call lookup window
      operationId: supervisorVoicemailsNeedingFollowUp
      responses:
        '200':
          description: Supervisor voicemail follow-up report
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Token

  parameters:
    OrganizationId: { name: organizationId, in: path, required: true, schema: { type: string, format: uuid } }
    TokenId: { name: tokenId, in: path, required: true, schema: { type: integer } }
    UserId: { name: userId, in: path, required: true, schema: { type: integer } }
    ExtensionId: { name: extensionId, in: path, required: true, schema: { type: string, format: uuid } }
    MediaId: { name: mediaId, in: path, required: true, schema: { type: string, format: uuid } }
    HolidayCalendarId: { name: holidayCalendarId, in: path, required: true, schema: { type: string, format: uuid } }
    ScheduleId: { name: scheduleId, in: path, required: true, schema: { type: string, format: uuid } }
    TeamId: { name: teamId, in: path, required: true, schema: { type: string, format: uuid } }
    FlowId: { name: flowId, in: path, required: true, schema: { type: string, format: uuid } }
    CallSessionId: { name: callSessionId, in: path, required: true, schema: { type: string, format: uuid } }
    CdrId: { name: cdrId, in: path, required: true, schema: { type: string, format: uuid } }
    PolicyId: { name: policyId, in: path, required: true, schema: { type: string, format: uuid } }
    DidId: { name: didId, in: path, required: true, schema: { type: string, format: uuid } }
    RingGroupId: { name: ringGroupId, in: path, required: true, schema: { type: string, format: uuid } }
    IvrId: { name: ivrId, in: path, required: true, schema: { type: string, format: uuid } }
    TimeConditionId: { name: timeConditionId, in: path, required: true, schema: { type: string, format: uuid } }
    WebhookId: { name: webhookId, in: path, required: true, schema: { type: string, format: uuid } }
    CallUuid: { name: callUuid, in: path, required: true, schema: { type: string } }
    EventId: { name: eventId, in: path, required: true, schema: { type: string, format: uuid } }
    RecordingId: { name: recordingId, in: path, required: true, schema: { type: string, format: uuid } }
    DeviceProfileId: { name: deviceProfileId, in: path, required: true, schema: { type: string, format: uuid } }
    GatewayId: { name: gatewayId, in: path, required: true, schema: { type: string, format: uuid } }
    BridgeId: { name: bridgeId, in: path, required: true, schema: { type: string, format: uuid } }
    AgentId: { name: agentId, in: path, required: true, schema: { type: string, format: uuid } }
    QueueId: { name: queueId, in: path, required: true, schema: { type: string, format: uuid } }
    AuditLogId: { name: auditLogId, in: path, required: true, schema: { type: string, format: uuid } }

  responses:
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Permission denied
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
              errors:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string

  schemas:
    ErrorResponse:
      type: object
      properties:
        message:
          type: string

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        role: { type: string }
        organization_id: { type: string, format: uuid, nullable: true }

    RegisterRequest:
      type: object
      required: [name, email, password, password_confirmation]
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        password_confirmation: { type: string, format: password }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }

    CreateTokenRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        abilities:
          type: array
          items: { type: string }

    OrganizationInput:
      type: object
      required: [name, domain]
      properties:
        name: { type: string }
        domain: { type: string }
        max_extensions: { type: integer }
        max_concurrent_calls: { type: integer }
        max_dids: { type: integer }
        max_ring_groups: { type: integer }
        is_active: { type: boolean }
        status: { type: string }
        settings: { type: object }

    OrganizationProvisionRequest:
      type: object
      required: [name, domain]
      properties:
        name: { type: string }
        domain: { type: string }
        max_extensions: { type: integer }
        max_concurrent_calls: { type: integer }
        max_dids: { type: integer }
        max_ring_groups: { type: integer }
        is_active: { type: boolean }
        status: { type: string }
        settings: { type: object }

    Organization:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        domain: { type: string }
        default_schedule_id:
          type: string
          format: uuid
          nullable: true
        default_holiday_calendar_id:
          type: string
          format: uuid
          nullable: true
        settings: { type: object, nullable: true }
        status: { type: string }
        max_extensions: { type: integer, nullable: true }
        max_concurrent_calls: { type: integer }
        max_dids: { type: integer }
        max_ring_groups: { type: integer }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time, nullable: true }
        updated_at: { type: string, format: date-time, nullable: true }

    FreeSwitchModule:
      type: object
      required: [name, type, status]
      properties:
        name: { type: string, example: mod_sofia }
        type: { type: string, example: endpoint }
        status: { type: string, example: running }

    FreeSwitchModulesMeta:
      type: object
      required: [source, live]
      properties:
        source:
          type: string
          example: esl
        live:
          type: boolean
          example: true
        error:
          type: string
          nullable: true
          example: Unable to connect to FreeSWITCH ESL.

    FreeSwitchModulesResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/FreeSwitchModule'
        meta:
          $ref: '#/components/schemas/FreeSwitchModulesMeta'

    FreeSwitchModulesUnavailableResponse:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          maxItems: 0
          items:
            $ref: '#/components/schemas/FreeSwitchModule'
        meta:
          allOf:
            - $ref: '#/components/schemas/FreeSwitchModulesMeta'
            - type: object
              required: [error]

    UserInput:
      type: object
      properties:
        name: { type: string }
        email: { type: string, format: email }
        password: { type: string, format: password }
        role: { type: string }
        organization_id: { type: string, format: uuid, nullable: true }

    WebRtcTlsMode:
      type: object
      required: [key, label, enabled, cert_dir, production_ready, summary, details, expected_files]
      properties:
        key:
          type: string
          enum: [trusted_ca, self_signed]
        label: { type: string }
        enabled: { type: boolean }
        cert_dir: { type: string }
        production_ready: { type: boolean }
        summary: { type: string }
        details: { type: string }
        expected_files:
          type: array
          items: { type: string }


    WebRtcConfig:
      type: object
      required:
        - enabled
        - websocket_url
        - sip_uri
        - sip_username
        - sip_password
        - sip_domain
        - display_name
        - ice_servers
        - codec_prefs
        - tls_mode
      properties:
        enabled: { type: boolean }
        websocket_url: { type: string, format: uri }
        sip_uri: { type: string }
        sip_username: { type: string }
        sip_password: { type: string }
        sip_domain: { type: string }
        display_name: { type: string }
        ice_servers:
          type: array
          items:
            type: object
            properties:
              urls: { type: string }
              username: { type: string }
              credential: { type: string }
        codec_prefs:
          type: array
          items: { type: string }
        tls_mode:
          type: object
          required: [active, modes]
          properties:
            active:
              type: string
              enum: [trusted_ca, self_signed]
            modes:
              $ref: '#/components/schemas/WebRtcTlsModes'

    PermissionMutationRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: string }

    ExtensionInput:
      type: object
      required: [extension, password]
      properties:
        extension: { type: string }
        password: { type: string }
        directory_first_name: { type: string }
        directory_last_name: { type: string }
        effective_caller_id_name: { type: string }
        effective_caller_id_number: { type: string }
        outbound_caller_id_name: { type: string }
        outbound_caller_id_number: { type: string }
        voicemail_enabled: { type: boolean }
        voicemail_pin: { type: string }
        is_active: { type: boolean }

    HolidayCalendarInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        is_active: { type: boolean }

    ScheduleInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        timezone: { type: string }
        rules:
          type: array
          items: { type: object }
        exceptions:
          type: array
          items: { type: object }
        breaks:
          type: array
          items: { type: object }
        is_active: { type: boolean }

    TeamInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        is_active: { type: boolean }
        members:
          type: array
          items: { type: object }

    FlowInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        nodes:
          type: array
          items: { type: object }
        edges:
          type: array
          items: { type: object }
        is_active: { type: boolean }

    CallRoutingPolicyInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        conditions:
          type: array
          items: { type: object }
        match_destination_type: { type: string }
        match_destination_id: { type: string, format: uuid }
        no_match_destination_type: { type: string }
        no_match_destination_id: { type: string, format: uuid }
        priority: { type: integer }
        is_active: { type: boolean }

    PolicyEvaluationRequest:
      type: object
      properties:
        did: { type: string }
        caller_id: { type: string }
        time: { type: string, format: date-time }
        metadata: { type: object }

    DidInput:
      type: object
      required: [number]
      properties:
        number: { type: string }
        destination_type:
          type: string
          enum: [extension, ring_group, ivr, voicemail, time_condition, call_routing_policy, flow, bridge]
        destination_id: { type: string, format: uuid }
        description: { type: string }
        is_active: { type: boolean }

    RingGroupInput:
      type: object
      required: [name, strategy]
      properties:
        name: { type: string }
        strategy: { type: string, enum: [simultaneous, sequential] }
        members:
          type: array
          items: { type: string, format: uuid }
        ring_timeout: { type: integer }
        timeout_destination_type: { type: string }
        timeout_destination_id: { type: string, format: uuid }
        is_active: { type: boolean }

    IvrInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        greet_long: { type: string }
        greet_short: { type: string }
        options: { type: object }
        timeout: { type: integer }
        max_failures: { type: integer }
        timeout_destination_type: { type: string }
        timeout_destination_id: { type: string, format: uuid }
        is_active: { type: boolean }

    TimeConditionInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
        rules:
          type: array
          items: { type: object }
        match_destination_type: { type: string }
        match_destination_id: { type: string, format: uuid }
        no_match_destination_type: { type: string }
        no_match_destination_id: { type: string, format: uuid }
        is_active: { type: boolean }

    WebhookInput:
      type: object
      required: [url, events, secret]
      properties:
        url: { type: string, format: uri, description: "The endpoint URL that will receive webhook POST requests." }
        events:
          type: array
          description: |
            List of event types this webhook subscribes to.
            ESL-sourced call lifecycle events: call.created, call.answered, call.ended, call.completed.
            Application events: call.started, call.bridge, call.missed, call.hangup, voicemail.received, registration.registered, registration.unregistered.
          items:
            type: string
            enum:
              - call.created
              - call.answered
              - call.ended
              - call.completed
              - call.started
              - call.bridge
              - call.missed
              - call.hangup
              - voicemail.received
              - registration.registered
              - registration.unregistered
        secret: { type: string, description: "Shared secret used for HMAC-SHA256 signature verification." }
        is_active: { type: boolean }

    OriginateCallRequest:
      type: object
      required: [extension, destination]
      properties:
        extension: { type: string }
        destination: { type: string }

    HangupCallRequest:
      type: object
      required: [uuid]
      properties:
        uuid: { type: string }
        cause: { type: string }

    TransferCallRequest:
      type: object
      required: [uuid, destination]
      properties:
        uuid: { type: string }
        destination: { type: string }
        leg: { type: string, enum: [aleg, bleg, both] }

    CallRecordingRequest:
      type: object
      required: [uuid, action]
      properties:
        uuid: { type: string }
        action: { type: string, enum: [start, stop] }

    HoldCallRequest:
      type: object
      required: [uuid, action]
      properties:
        uuid: { type: string }
        action: { type: string, enum: [hold, unhold] }

    DeviceProfileInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        vendor: { type: string }
        model: { type: string }
        mac_address: { type: string }
        config: { type: object }
        is_active: { type: boolean }

    GatewayInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        host: { type: string }
        proxy: { type: string }
        register_proxy: { type: string }
        port: { type: integer }
        username: { type: string }
        password: { type: string }
        realm: { type: string }
        from_domain: { type: string }
        extension: { type: string }
        transport: { type: string }
        register: { type: boolean }
        expire_seconds: { type: integer }
        retry_seconds: { type: integer }
        caller_id_in_from: { type: boolean }
        profile: { type: string }
        is_active: { type: boolean }

    BridgeInput:
      type: object
      required: [name, bridge_type, destination_template]
      properties:
        name: { type: string }
        bridge_type: { type: string, enum: [gateway, raw] }
        gateway_id: { type: string, format: uuid }
        destination_template:
          type: string
          description: Destination to bridge to. For gateway bridges this is the outbound target number, for raw bridges this can be a FreeSWITCH dial string.
          examples: ['+15551234567', 'sofia/external/support@example.com']
        description: { type: string }
        is_active: { type: boolean }

    AgentInput:
      type: object
      required: [name, extension_id]
      properties:
        name: { type: string }
        extension_id: { type: string, format: uuid }
        role: { type: string }
        is_active: { type: boolean }

    AgentStateChangeRequest:
      type: object
      required: [state]
      properties:
        state: { type: string }
        note: { type: string }

    QueueInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        strategy: { type: string }
        max_wait_time: { type: integer }
        service_level_threshold: { type: integer }
        music_on_hold: { type: string }
        is_active: { type: boolean }

    QueueMemberAddRequest:
      type: object
      required: [agent_id]
      properties:
        agent_id: { type: string, format: uuid }
        weight: { type: integer }
        paused: { type: boolean }

    CallDetailRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        uuid: { type: string }
        caller_id_name: { type: string }
        caller_id_number: { type: string }
        destination_number: { type: string }
        context: { type: string }
        start_stamp: { type: string, format: date-time }
        answer_stamp: { type: string, format: date-time, nullable: true }
        end_stamp: { type: string, format: date-time }
        duration: { type: integer }
        billsec: { type: integer }
        hangup_cause: { type: string }
        direction: { type: string, enum: [inbound, outbound] }
        call_type: { type: string, enum: [inbound, outbound, internal, emergency] }
        quality_score: { type: number, format: float, minimum: 0, maximum: 5 }
        mos: { type: number, format: float }
        packet_loss: { type: number, format: float }
        jitter: { type: integer }
        latency: { type: integer }
        sip_user_agent: { type: string }
        remote_media_ip: { type: string }
        tags: { type: array, items: { type: string } }
        metadata: { type: object }
        enrichment:
          $ref: '#/components/schemas/CdrEnrichment'

    CdrEnrichment:
      type: object
      properties:
        country_code: { type: string }
        country_name: { type: string }
        carrier_name: { type: string }
        number_type: { type: string }
        is_mobile: { type: boolean }
        raw_data: { type: object }

    CdrAnalyticsSummary:
