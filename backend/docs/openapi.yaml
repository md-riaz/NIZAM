      summary: Get real-time SIP registration status for a single gateway
      description: |
        Queries FreeSWITCH live via ESL (sofia status gateway {name}) and returns current state.
        
        Response includes:
        - data.state - gateway state (e.g., reged, noreg, failed)
        - data.status - status text from FreeSWITCH
        - data.registered - boolean indicating if gateway is currently registered
        - meta.source - always esl
        - meta.live - always true
      operationId: getGatewayStatus
      responses:
        '200':
          description: Gateway status details
          content:
            application/json:
              schema:
                type: object

