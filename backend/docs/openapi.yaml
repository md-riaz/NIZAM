openapi: 3.1.0
info:
  title: NIZAM — Open Communications Control Platform API
  description: |
    Current API specification generated from the active Laravel route tree.
    Covers core routes and module-provided routes under /api/v1.
  version: 1.0.1
  contact:
    name: NIZAM Support
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8231/api/v1
    description: Local development
  - url: https://api.nizam.example.com/api/v1
    description: Production

security:
  - bearerAuth: []

tags:
  - name: Authentication
  - name: Health
  - name: Organizations
  - name: Extensions
  - name: DIDs
  - name: Ring Groups
  - name: IVRs
  - name: Time Conditions
  - name: Call Routing Policies
  - name: Flows
  - name: Call Sessions
  - name: Calls
  - name: CDRs
  - name: Recordings
  - name: Webhooks
  - name: Call Events
  - name: Device Profiles
  - name: Gateways
  - name: Bridges
  - name: Codec Metrics
  - name: Holiday Calendars
  - name: Schedules
  - name: Teams
  - name: Agents
  - name: Queues
  - name: Queue Metrics
  - name: Usage
  - name: Admin
  - name: Users
  - name: Audit Logs
  - name: System Media
  - name: Registration Status

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: |
        Check platform health including database, cache, and FreeSWITCH connectivity.
        
        This endpoint queries all backing services live:
        - Database: SELECT 1 probe
        - Cache: write/read test
        - FreeSWITCH: ESL connection + live status, sofia status, and show registrations queries
        
        All gateway and registration data is marked with source=esl and live=true.
        
        Returns HTTP 200 if healthy, 503 if degraded.
      security: []
      operationId: healthCheck
      responses:
        '200':
          description: Healthy or degraded status
          content:
            application/json:
              schema:
                type: object

  /auth/register:
    post:
      tags: [Authentication]
      summary: Register a new user
      security: []
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/login:
    post:
      tags: [Authentication]
      summary: Login and receive bearer token
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout current token
      operationId: logout
      responses:
        '200':
          description: Logged out

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current authenticated user
      operationId: me
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'

  /auth/tokens:
    get:
      tags: [Authentication]
      summary: List API tokens
      operationId: listTokens
      responses:
        '200':
          description: Token list
          content:
            application/json:
              schema:
                type: object
    post:
      tags: [Authentication]
      summary: Create API token
      operationId: createToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTokenRequest'
      responses:
        '201':
          description: Token created
          content:
            application/json:
              schema:
                type: object

  /auth/tokens/{tokenId}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    delete:
      tags: [Authentication]
      summary: Revoke API token
      operationId: revokeToken
      responses:
        '204':
          description: Token revoked

  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      operationId: listOrganizations
      responses:
        '200':
          description: Organization list
    post:
      tags: [Organizations]
      summary: Create organization
      operationId: createOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '201':
          description: Organization created

  /organizations/provision:
    post:
      tags: [Organizations]
      summary: Provision organization with automated setup
      operationId: provisionOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationProvisionRequest'
      responses:
        '201':
          description: Organization provisioned

  /organizations/{organizationId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      summary: Get organization
      operationId: getOrganization
      responses:
        '200':
          description: Organization details
    put:
      tags: [Organizations]
      summary: Update organization
      operationId: updateOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrganizationInput'
      responses:
        '200':
          description: Organization updated
    delete:
      tags: [Organizations]
      summary: Delete organization
      operationId: deleteOrganization
      responses:
        '204':
          description: Organization deleted

  /organizations/{organizationId}/settings:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      summary: Get organization settings
      operationId: getOrganizationSettings
      responses:
        '200':
          description: Settings response
    put:
      tags: [Organizations]
      summary: Merge-update organization settings
      operationId: updateOrganizationSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                settings:
                  type: object
      responses:
        '200':
          description: Settings updated

  /admin/dashboard:
    get:
      tags: [Admin]
      summary: System-wide admin dashboard
      operationId: adminDashboard
      responses:
        '200':
          description: Dashboard data

  /admin/freeswitch/modules:
    get:
      tags: [Admin]
      summary: List live FreeSWITCH module status
      description: |
        Platform-admin only endpoint that queries FreeSWITCH live via ESL and returns normalized
        module rows.

        On success the response includes `meta.source = esl` and `meta.live = true`.
        When FreeSWITCH cannot be reached, the endpoint returns HTTP 503 with an empty `data`
        array and `meta.error` describing the failure.
      operationId: listFreeSwitchModules
      responses:
        '200':
          description: FreeSWITCH module status list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeSwitchModulesResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: FreeSWITCH is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FreeSwitchModulesUnavailableResponse'

  /admin/sip-profiles:
    get:
      tags: [Admin]
      summary: List SIP profiles
      operationId: listSipProfiles
      responses:
        '200':
          description: SIP profile list
    post:
      tags: [Admin]
      summary: Create SIP profile
      operationId: createSipProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SipProfileInput'
      responses:
        '201':
          description: SIP profile created

  /admin/sip-profiles/{sipProfileId}:
    parameters:
      - name: sipProfileId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Admin]
      summary: Get SIP profile
      operationId: getSipProfile
      responses:
        '200':
          description: SIP profile details
    put:
      tags: [Admin]
      summary: Update SIP profile
      operationId: updateSipProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SipProfileInput'
      responses:
        '200':
          description: SIP profile updated
    delete:
      tags: [Admin]
      summary: Delete SIP profile
      operationId: deleteSipProfile
      responses:
        '204':
          description: SIP profile deleted

  /admin/blocked-destinations:
    get:
      tags: [Admin]
      summary: List blocked destinations
      operationId: listBlockedDestinations
      parameters:
        - name: organization_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Blocked destination list
    post:
      tags: [Admin]
      summary: Create blocked destination
      operationId: createBlockedDestination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedDestinationInput'
      responses:
        '201':
          description: Blocked destination created

  /admin/blocked-destinations/{blockedDestinationId}:
    parameters:
      - name: blockedDestinationId
        in: path
        required: true
        schema: { type: integer }
    get:
      tags: [Admin]
      summary: Get blocked destination
      operationId: getBlockedDestination
      responses:
        '200':
          description: Blocked destination details
    put:
      tags: [Admin]
      summary: Update blocked destination
      operationId: updateBlockedDestination
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BlockedDestinationInput'
      responses:
        '200':
          description: Blocked destination updated
    delete:
      tags: [Admin]
      summary: Delete blocked destination
      operationId: deleteBlockedDestination
      responses:
        '204':
          description: Blocked destination deleted

  /users:
    get:
      tags: [Users]
      summary: List users
      operationId: listUsers
      responses:
        '200':
          description: User list
    post:
      tags: [Users]
      summary: Create user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '201':
          description: User created

  /users/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Get user
      operationId: getUser
      responses:
        '200':
          description: User details
    put:
      tags: [Users]
      summary: Update user
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        '200':
          description: User updated
    delete:
      tags: [Users]
      summary: Delete user
      operationId: deleteUser
      responses:
        '204':
          description: User deleted

  /users/{userId}/permissions:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: List user permissions
      operationId: listUserPermissions
      responses:
        '200':
          description: Permission list

  /users/{userId}/permissions/grant:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Grant permissions to user
      operationId: grantUserPermissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionMutationRequest'
      responses:
        '200':
          description: Permissions granted

  /users/{userId}/permissions/revoke:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Users]
      summary: Revoke permissions from user
      operationId: revokeUserPermissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PermissionMutationRequest'
      responses:
        '200':
          description: Permissions revoked

  /permissions:
    get:
      tags: [Users]
      summary: List available permissions
      operationId: listAvailablePermissions
      responses:
        '200':
          description: Available permissions

  /organizations/{organizationId}/stats:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Organizations]
      summary: Get organization stats
      operationId: organizationStats
      responses:
        '200':
          description: Organization statistics

  /organizations/{organizationId}/usage/summary:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Usage]
      summary: Get usage summary
      operationId: usageSummary
      responses:
        '200':
          description: Usage summary

  /organizations/{organizationId}/usage/collect:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    post:
      tags: [Usage]
      summary: Collect usage snapshot
      operationId: usageCollect
      responses:
        '200':
          description: Usage snapshot collected

  /organizations/{organizationId}/usage/reconcile:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Usage]
      summary: Reconcile usage against CDRs
      operationId: usageReconcile
      responses:
        '200':
          description: Usage reconciliation

  /organizations/{organizationId}/extensions:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Extensions]
      summary: List extensions
      operationId: listExtensions
      responses:
        '200':
          description: Extension list
    post:
      tags: [Extensions]
      summary: Create extension
      operationId: createExtension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionInput'
      responses:
        '201':
          description: Extension created

  /organizations/{organizationId}/extensions/{extensionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ExtensionId'
    get:
      tags: [Extensions]
      summary: Get extension
      operationId: getExtension
      responses:
        '200':
          description: Extension details
    put:
      tags: [Extensions]
      summary: Update extension
      operationId: updateExtension
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtensionInput'
      responses:
        '200':
          description: Extension updated
    delete:
      tags: [Extensions]
      summary: Delete extension
      operationId: deleteExtension
      responses:
        '204':
          description: Extension deleted

  /organizations/{organizationId}/extensions/status/all:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Extensions]
      summary: Get real-time SIP registration status for all extensions
      operationId: getAllExtensionsStatus
      responses:
        '200':
          description: Extensions status details
          content:
            application/json:
              schema:
                type: object

  /organizations/{organizationId}/extensions/{extensionId}/status:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ExtensionId'
    get:
      tags: [Extensions]
      summary: Get real-time SIP registration status for a single extension
      operationId: getExtensionStatus
      responses:
        '200':
          description: Extension status details
          content:
            application/json:
              schema:
                type: object

  /organizations/{organizationId}/extensions/{extensionId}/webrtc-config:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ExtensionId'
    get:
      tags: [Extensions]
      summary: Get WebRTC configuration for extension
      description: Returns runtime WebRTC registration settings for a organization extension. If WebRTC is disabled system-wide, the endpoint responds with 403.
      operationId: getWebRtcConfig
      responses:
        '200':
          description: WebRTC configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/WebRtcConfig' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: WebRTC is disabled or caller lacks permission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationId}/holiday-calendars:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Holiday Calendars]
      summary: List holiday calendars
      operationId: listHolidayCalendars
      responses:
        '200':
          description: Holiday calendar list
    post:
      tags: [Holiday Calendars]
      summary: Create holiday calendar
      operationId: createHolidayCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayCalendarInput'
      responses:
        '201':
          description: Holiday calendar created

  /organizations/{organizationId}/holiday-calendars/{holidayCalendarId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/HolidayCalendarId'
    get:
      tags: [Holiday Calendars]
      summary: Get holiday calendar
      operationId: getHolidayCalendar
      responses:
        '200':
          description: Holiday calendar details
    put:
      tags: [Holiday Calendars]
      summary: Update holiday calendar
      operationId: updateHolidayCalendar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HolidayCalendarInput'
      responses:
        '200':
          description: Holiday calendar updated
    delete:
      tags: [Holiday Calendars]
      summary: Delete holiday calendar
      operationId: deleteHolidayCalendar
      responses:
        '204':
          description: Holiday calendar deleted

  /organizations/{organizationId}/schedules:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Schedules]
      summary: List schedules
      operationId: listSchedules
      responses:
        '200':
          description: Schedule list
    post:
      tags: [Schedules]
      summary: Create schedule
      operationId: createSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '201':
          description: Schedule created

  /organizations/{organizationId}/schedules/{scheduleId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [Schedules]
      summary: Get schedule
      operationId: getSchedule
      responses:
        '200':
          description: Schedule details
    put:
      tags: [Schedules]
      summary: Update schedule
      operationId: updateSchedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleInput'
      responses:
        '200':
          description: Schedule updated
    delete:
      tags: [Schedules]
      summary: Delete schedule
      operationId: deleteSchedule
      responses:
        '204':
          description: Schedule deleted

  /organizations/{organizationId}/teams:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Teams]
      summary: List teams
      operationId: listTeams
      responses:
        '200':
          description: Team list
    post:
      tags: [Teams]
      summary: Create team
      operationId: createTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '201':
          description: Team created

  /organizations/{organizationId}/teams/{teamId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/TeamId'
    get:
      tags: [Teams]
      summary: Get team
      operationId: getTeam
      responses:
        '200':
          description: Team details
    put:
      tags: [Teams]
      summary: Update team
      operationId: updateTeam
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamInput'
      responses:
        '200':
          description: Team updated
    delete:
      tags: [Teams]
      summary: Delete team
      operationId: deleteTeam
      responses:
        '204':
          description: Team deleted

  /organizations/{organizationId}/flows:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Flows]
      summary: List flows
      operationId: listFlows
      responses:
        '200':
          description: Flow list
    post:
      tags: [Flows]
      summary: Create flow
      operationId: createFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowInput'
      responses:
        '201':
          description: Flow created

  /organizations/{organizationId}/flows/{flowId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/FlowId'
    get:
      tags: [Flows]
      summary: Get flow
      operationId: getFlow
      responses:
        '200':
          description: Flow details
    put:
      tags: [Flows]
      summary: Update flow
      operationId: updateFlow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FlowInput'
      responses:
        '200':
          description: Flow updated
    delete:
      tags: [Flows]
      summary: Delete flow
      operationId: deleteFlow
      responses:
        '204':
          description: Flow deleted

  /organizations/{organizationId}/flows/{flowId}/publish:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/FlowId'
    post:
      tags: [Flows]
      summary: Publish latest flow version
      operationId: publishFlow
      responses:
        '200':
          description: Flow published

  /organizations/{organizationId}/calls:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [Call Sessions]
      summary: List call sessions
      operationId: listCallSessions
      responses:
        '200':
          description: Call session list

  /organizations/{organizationId}/calls/{callSessionId}:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CallSessionId'
    get:
      tags: [Call Sessions]
      summary: Get call session
      operationId: getCallSession
      responses:
        '200':
          description: Call session details

  /organizations/{organizationId}/calls/{callSessionId}/analyze:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/CallSessionId'
    get:
      tags: [Call Sessions]
      summary: Analyze call session trace
      operationId: analyzeCallSession
      responses:
        '200':
          description: Call session analysis

  /organizations/{organizationId}/cdrs/export:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [CDRs]
      summary: Export CDRs (Simple)
      operationId: exportCdrs
      responses:
        '200':
          description: CSV/JSON export stream
    post:
      tags: [CDRs]
      summary: Advanced CDR Export
      description: Export filtered CDRs in CSV or JSON format.
      operationId: exportCdrsAdvanced
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { type: string, enum: [csv, json], default: csv }
                filters: { type: object }
      responses:
        '200':
          description: CDR export file

  /organizations/{organizationId}/cdrs:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [CDRs]
      summary: List CDRs with advanced filtering
      operationId: listCdrs
      parameters:
        - name: q
          in: query
          description: Full-text search on caller, destination, UUID
          schema: { type: string }
        - name: call_type
          in: query
          schema: { type: string, enum: [inbound, outbound, internal, emergency] }
        - name: quality_score_min
          in: query
          schema: { type: number, minimum: 0, maximum: 5 }
        - name: direction
          in: query
          schema: { type: string, enum: [inbound, outbound] }
        - name: start_date
          in: query
          schema: { type: string, format: date-time }
        - name: end_date
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: CDR list with pagination and enrichment data

  /organizations/{organizationId}/cdrs/analytics/summary:
    parameters:
      - $ref: '#/components/parameters/OrganizationId'
    get:
      tags: [CDRs]
      summary: Get CDR summary analytics (ASR, ACD)
      operationId: cdrAnalyticsSummary
      responses:
        '200':
          description: Summary stats
