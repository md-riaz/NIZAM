services:
  esl-listener:
    image: php-app:${APP_IMAGE_TAG:-local}
    container_name: esl-listener
    restart: unless-stopped
    command: php artisan freeswitch:listen
    volumes:
      - ./backend:/var/www/html
      - vendor_data:/var/www/html/vendor
    networks:
      - app_net
    env_file: .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_URL=${APP_URL:-http://localhost:8231}
      - DB_CONNECTION=pgsql
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DB_DATABASE:-communications}
      - DB_USERNAME=${DB_USERNAME:-communications}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - FREESWITCH_HOST=freeswitch
      - FREESWITCH_XML_CURL_URL=${FREESWITCH_XML_CURL_URL:-http://nginx/freeswitch/xml-curl}
      - FREESWITCH_LOG_PATH=${FREESWITCH_LOG_PATH:-/var/log/freeswitch/freeswitch.log}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - CACHE_STORE=${CACHE_STORE:-database}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}

  freeswitch:
    build:
      context: ./backend
      dockerfile: docker/freeswitch/Dockerfile
    container_name: freeswitch
    restart: unless-stopped
    cap_add:
      - SYS_NICE
    ulimits:
      rtprio:
        soft: 99
        hard: 99
    ports:
      - "${FREESWITCH_SIP_PORT:-5060}:5060/udp"
      - "${FREESWITCH_SIP_PORT:-5060}:5060/tcp"
      - "${FREESWITCH_EXTERNAL_SIP_PORT:-5080}:5080/udp"
      - "${FREESWITCH_EXTERNAL_SIP_PORT:-5080}:5080/tcp"
      - "${FREESWITCH_WSS_PORT:-7443}:7443/tcp"
      - "${FREESWITCH_RTP_PORT_RANGE:-16384-16484}:16384-16484/udp"
    volumes:
      - freeswitch_data:/var/lib/freeswitch
      - freeswitch_logs:/var/log/freeswitch
      - certs_data:/usr/local/freeswitch/certs
      - ./backend/storage/app/freeswitch/sip_profiles:/usr/local/freeswitch/conf/sip_profiles
      - ./backend/docker/freeswitch/conf/autoload_configs/xml_curl.conf.xml:/usr/local/freeswitch/conf/autoload_configs/xml_curl.conf.xml
      - ./backend/docker/freeswitch/conf/autoload_configs/sofia.conf.xml:/usr/local/freeswitch/conf/autoload_configs/sofia.conf.xml
      - ./backend/docker/freeswitch/entrypoint.sh:/usr/local/bin/docker-entrypoint.sh
    networks:
      - app_net
    environment:
      - FREESWITCH_XML_CURL_ENDPOINT_INTERNAL=${FREESWITCH_XML_CURL_ENDPOINT_INTERNAL:-http://nginx/freeswitch/xml-curl}

volumes:
  freeswitch_data:
    name: freeswitch_data
  freeswitch_logs:
    name: freeswitch_logs
  certs_data:
    name: certs_data
  vendor_data:
    name: vendor_data

networks:
  app_net:
    name: app-net
    driver: bridge
